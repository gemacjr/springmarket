services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: springmarket
      POSTGRES_USER: springmarket
      POSTGRES_PASSWORD: springmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U springmarket"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  mongodata:
