spring:
  rabbitmq:
    host: localhost
    port: 5672
  mail:
    host: localhost
    port: 1025
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
  data:
    mongodb:
      uri: mongodb://localhost:27017/springmarket
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://localhost:5432/springmarket
    username: springmarket
    password: springmarket
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origin: http://localhost:5173

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
