spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 100

app:
  jwt:
    secret: test-secret-must-be-at-least-32-bytes
  cors:
    allowed-origin: http://localhost:5173
